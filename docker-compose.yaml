# docker-compose.yaml
# La ligne 'version' a été supprimée (obsolète)

services:
  streamlit-app:
    build: .
    container_name: streamlit_app
    ports:
      - "8501:8501"
    
    volumes:
      # Données persistantes
      - streamlit_data:/app/data
      # Configuration externe (lecture seule)
      - ./config:/app/config:ro
    
    environment:
      - APP_ENV=production
      - DATA_PATH=/app/data
      - CONFIG_PATH=/app/config
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
    
    restart: unless-stopped
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  streamlit_data:
    driver: local